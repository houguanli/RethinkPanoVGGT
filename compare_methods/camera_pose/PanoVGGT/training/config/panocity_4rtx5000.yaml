defaults:
  - default.yaml

exp_name: panocity_4rtx5000
img_size: 518
patch_size: 14
num_workers: 8
max_img_per_gpu: 8
max_epochs: 20
limit_train_batches: 800
limit_val_batches: 400

hardware:
  gpus: 4
  gpu_model: rtx_5000
  walltime_hours: 24

logging:
  log_dir: logs

data:
  train:
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      training: True
      load_depth: True
      img_nums: [8, 8]
      max_img_per_gpu: ${max_img_per_gpu}
    dataset:
      _target_: training.data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: training.data.datasets.panocity_paired.PanoCityPairedDataset
          root: ${oc.env:PANOCITY_ROOT,../PanoCity_paired}
          split: train
  val:
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      training: False
      load_depth: True
      img_nums: [8, 8]
    dataset:
      _target_: training.data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: training.data.datasets.panocity_paired.PanoCityPairedDataset
          root: ${oc.env:PANOCITY_ROOT,../PanoCity_paired}
          split: test

checkpoint:
  resume_checkpoint_path: ../../../ckpt/PanoVGGT/model.pt
  save_dir: logs/${exp_name}/ckpts
