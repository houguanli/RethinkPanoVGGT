method:
  name: dap
  path: depth_geometry/DAP
panocity:
  root: ${PANOCITY_ROOT:-../PanoCity_paired}
  layout: paired_csv
  pairs_file: pairs.csv
hardware:
  gpus: 4
  gpu_model: rtx_5000
  launcher: torchrun
budget:
  walltime_hours: 24
  max_epochs: 20
  reference: luna
finetune:
  supported: false
  unsupported_reason: DAP checkout has inference/evaluation configs but no public training entrypoint.
  command: [python, finetune_panocity.py, --stage, smoke]
evaluate:
  command: [python, evaluate_panocity.py, --stage, smoke]
