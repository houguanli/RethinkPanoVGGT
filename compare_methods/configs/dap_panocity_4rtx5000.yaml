method:
  name: dap
  path: depth_geometry/DAP
panocity:
  root: ${PANOCITY_ROOT:-../PanoCity_paired}
  layout: paired_csv
  pairs_file: pairs.csv
hardware:
  gpus: 4
  gpu_model: rtx_5000
  launcher: torchrun
budget:
  walltime_hours: 24
  max_epochs: 20
  reference: luna
finetune:
  supported: true
  command: [torchrun, --standalone, --nproc_per_node=4, train_panocity.py, --config, config/train_panocity_4rtx5000.yaml, --output-dir, outputs/panocity_4rtx5000]
evaluate:
  command: [python, evaluate_panocity.py, --stage, smoke]
