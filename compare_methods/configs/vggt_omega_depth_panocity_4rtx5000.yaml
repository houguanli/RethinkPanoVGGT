method:
  name: vggt_omega_depth
  path: depth_geometry/VGGT-Omega
panocity:
  root: ${PANOCITY_ROOT:-../PanoCity_paired}
  layout: paired_csv
  pairs_file: pairs.csv
hardware:
  gpus: 4
  gpu_model: rtx_5000
  launcher: torchrun
budget:
  walltime_hours: 24
  max_epochs: 20
  reference: luna
finetune:
  supported: true
  command: [torchrun, --standalone, --nproc_per_node=4, train_panocity.py, --config, ../../configs/vggt_omega_depth_panocity_4rtx5000.yaml, --checkpoint, ../../../ckpt/VGGT-Omega/vggt_omega_1b_512.pt, --output-dir, outputs/panocity_4rtx5000]
evaluate:
  command: [python, check_panocity_depth.py, --config, ../../configs/vggt_omega_depth_panocity_4rtx5000.yaml, --checkpoint, ../../camera_pose/VGGT-Omega/outputs/panocity_4rtx5000/model.pt, --split, test, --max-samples, "4", --output-json, outputs/panocity_4rtx5000/depth_check.json]
train:
  image_size: 512
  smoke_image_size: 256
  batch_size: 1
  num_workers: 4
  lr: 1.0e-5
  weight_decay: 0.01
  depth_scale: 100.0
  max_depth_meters: 100.0
  target_mode: metric
  normalize_rgb: false
