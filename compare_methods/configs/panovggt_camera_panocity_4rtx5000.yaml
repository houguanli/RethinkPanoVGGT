method:
  name: panovggt_camera
  path: camera_pose/PanoVGGT
panocity:
  root: ${PANOCITY_ROOT:-../PanoCity_paired}
  layout: paired_csv
  pairs_file: pairs.csv
hardware:
  gpus: 4
  gpu_model: rtx_5000
  launcher: torchrun
budget:
  walltime_hours: 12
  max_epochs: 40
  limit_train_batches: 2000
  reference: luna
finetune:
  supported: true
  command: [torchrun, --standalone, --nproc_per_node=4, training/launch.py, --config, panocity_4rtx5000]
evaluate:
  command: [python, inference.py, --help]
