# 4x RTX 5000: multi-pano mixed PanoVGGT bundle, low384 to high512.
data:
  dataset_root: ../../panovggt
  dataset_format: pano_minimal
  minimal_datasets: all
  dataset_sampling_weights: "panocity:0.45,matterport3d:0.25,structured3d:0.25,stanford2d3ds:0.05"
  dataset_split: train
  train_split_fraction: 0.95
  split_seed: 42
  metadata_path: null
  bad_sample_list: configs/structured3d_bad_scenes.txt
  curriculum_bins: null
  use_metadata_weights: false
  checkpoint: ../baseline01_vggt_omega/logs/mixed4_pano_low_to_high_4xrtx5000_full_warmup_3h_for_luna/ckpts/checkpoint.pt
  pano_sample_mode: variable_neighborhood
  pano_min_count: 2
  pano_max_count: 8
  pano_grouping: nearest
  output_depth_scale: 1000.0
  invalid_depth_value: 65535.0
  pano_position_step_m: 1.0

sampler:
  patch_size: 16
  window_size: 384
  # 2..8 panos x 4 yaw windows stress-tests up to 32 VGGT views at 384.
  num_yaw: 4
  pitch_degrees: "-15"
  fov_degrees: 75.0
  pano_height: 0
  pano_width: 0
  luna_patch_layers: second_half
  luna_camera_layers: "23"

model:
  enable_pano_global_token: true
  aggregator_use_checkpoint: true
  # Keep 2..8 panos x 4 yaw as the model context, but decode dense depth in
  # smaller frame chunks so a full 32-window sample fits on 32GB RTX5000 cards.
  dense_head_frames_chunk_size: 1
  dense_head_use_checkpoint: true
  dense_head_return_confidence: false

supervision:
  gt_depth_semantics: range
  depth_max_m: 80.0
  depth_loss_mode: log_huber
  depth_log_error_clip: 0.5
  depth_log_huber_delta: 0.2
  loss_sample_weighting: true
  min_window_valid_ratio: 0.05
  valid_ratio_loss_power: 0.5
  sample_weight_min: 0.25
  sample_weight_max: 1.25
  overlap_consistency_weight: 0.02
  overlap_band_fraction: 0.20
  pred_depth_scale: 2.7437050342559814
  learn_pred_depth_scale: true
  pred_depth_scale_lr: 5.0e-5
  depth_residual_mode: log_conv
  depth_residual_hidden: 32
  depth_residual_max_log: 0.5
  depth_residual_frames_chunk_size: 1
  depth_residual_use_checkpoint: true
  store_depth_residual_debug: false
  enable_camera_head: true
  camera_supervision_mode: pano_relative
  camera_loss_weight: 1.0
  camera_translation_weight: 1.0
  camera_rotation_weight: 1.0
  camera_fov_weight: 0.0
  pano_translation_consistency_weight: 0.1
  camera_position_mode: relative_anchor

optimization:
  trainable: luna_residual_tail_heads
  lr: 5.0e-5
  weight_decay: 0.05
  grad_clip: 1.0
  optimizer_type: adafactor
  batch_size: 1
  training_stages:
    - name: multipano_residual_fit_low384
      until_minutes: 360.0
      window_size: 384
      dense_head_frames_chunk_size: 1
      trainable: luna_residual_tail_heads
      lr: 5.0e-5
      pred_depth_scale_lr: 5.0e-5
      weight_decay: 0.05
      optimizer_type: adafactor
      enable_luna_forward: true
      enable_depth_residual: true
      train_depth_residual: true
      learn_pred_depth_scale: true
    - name: multipano_residual_low_lr_high512
      window_size: 512
      dense_head_frames_chunk_size: 1
      trainable: luna_residual_tail_heads
      lr: 1.0e-5
      pred_depth_scale_lr: 1.0e-5
      weight_decay: 0.05
      optimizer_type: adafactor
      enable_luna_forward: true
      enable_depth_residual: true
      train_depth_residual: true
      learn_pred_depth_scale: true

runtime:
  device: cuda
  distributed: auto
  dist_backend: nccl
  find_unused_parameters: true
  amp_dtype: bfloat16
  epochs: 100000
  max_steps: 1000000
  num_workers: 4
  seed: 43
  max_duration_minutes: 540.0
  save_every_steps: 5000
  save_last: true
  checkpoint_format: trainable_delta
  debug_depth_dump: false
  debug_depth_threshold: 0.3
  debug_depth_max_dumps_per_step: 0
  debug_dir: logs/debug_mixed4_pano_low_to_high_4xrtx5000_multipano_after_full_warmup_9h
  progress_bar: true
  progress_log_every: 50
  tensorboard: true
  tensorboard_dir: logs/mixed4_pano_low_to_high_4xrtx5000_multipano_after_full_warmup_9h/tensorboard

output:
  output_dir: logs/mixed4_pano_low_to_high_4xrtx5000_multipano_after_full_warmup_9h
