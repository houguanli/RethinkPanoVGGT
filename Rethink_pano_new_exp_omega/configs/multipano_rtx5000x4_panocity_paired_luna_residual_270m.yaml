# Multi-pano PanoCity paired profile for a 4x RTX 5000 machine.
# Launch with torchrun --nproc_per_node=4 for synchronized DDP training.
data:
  dataset_root: ../../panovggt/PanoCity_paired
  dataset_format: panocity_paired
  dataset_split: train
  train_split_fraction: 0.95
  split_seed: 42
  metadata_path: metadata/panocity_manifest.jsonl
  curriculum_bins: clean,normal
  use_metadata_weights: true
  checkpoint: ../ckpt/vggt_omega_1b_512.pt
  pano_sample_mode: variable_neighborhood
  pano_min_count: 2
  pano_max_count: 4
  pano_grouping: nearest
  output_depth_scale: 1000.0
  invalid_depth_value: 65535.0
  pano_position_step_m: 1.0

sampler:
  patch_size: 16
  window_size: 512
  # 2..4 panos x 4 yaw windows keeps the max at 16 VGGT views.
  num_yaw: 4
  pitch_degrees: "-15"
  fov_degrees: 75.0
  pano_height: 0
  pano_width: 0
  luna_patch_layers: last3
  luna_camera_layers: "23"

model:
  enable_pano_global_token: false
  enable_pano_geometry_residual: false

supervision:
  gt_depth_semantics: range
  depth_max_m: 80.0
  depth_loss_mode: clipped_log_l1
  depth_log_error_clip: 0.5
  depth_log_huber_delta: 0.2
  loss_sample_weighting: true
  min_window_valid_ratio: 0.05
  valid_ratio_loss_power: 0.5
  sample_weight_min: 0.25
  sample_weight_max: 1.25
  overlap_consistency_weight: 0.02
  overlap_band_fraction: 0.20
  pred_depth_scale: 5.491308212280273
  learn_pred_depth_scale: true
  pred_depth_scale_lr: 5.0e-5
  depth_residual_mode: log_conv
  depth_residual_hidden: 32
  depth_residual_max_log: 0.5
  enable_camera_head: true
  camera_supervision_mode: pano_relative
  camera_loss_weight: 1.0
  camera_translation_weight: 1.0
  camera_rotation_weight: 0.0
  camera_fov_weight: 0.0
  pano_translation_consistency_weight: 0.1
  camera_position_mode: relative_anchor

optimization:
  trainable: luna_residual_heads
  lr: 5.0e-5
  weight_decay: 0.05
  grad_clip: 1.0
  optimizer_type: adamw
  batch_size: 1
  training_stages:
    - name: multipano_residual_fit
      trainable: luna_residual_heads
      lr: 5.0e-5
      pred_depth_scale_lr: 5.0e-5
      weight_decay: 0.05
      optimizer_type: adamw
      enable_luna_forward: true
      enable_depth_residual: true
      train_depth_residual: true
      learn_pred_depth_scale: true

runtime:
  device: cuda
  distributed: auto
  dist_backend: nccl
  find_unused_parameters: true
  amp_dtype: bfloat16
  epochs: 100000
  max_steps: 1000000
  num_workers: 4
  seed: 43
  max_duration_minutes: 270.0
  save_every_steps: 5000
  save_last: true
  checkpoint_format: trainable_delta
  debug_depth_dump: true
  debug_depth_threshold: 0.3
  debug_depth_max_dumps_per_step: 2
  debug_dir: logs/debug_panocity_paired_multipano_4xrtx5000
  progress_bar: true
  progress_log_every: 50
  tensorboard: true
  tensorboard_dir: logs/panocity_paired_multipano_4xrtx5000/tensorboard

output:
  output_dir: logs/panocity_paired_multipano_4xrtx5000
