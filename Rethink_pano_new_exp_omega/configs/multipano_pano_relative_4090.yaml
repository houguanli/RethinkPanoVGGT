# RTX 4090 profile for variable-length multi-pano training.
# The model sees 2..X neighboring panos. Per-window geometry is fixed by the
# pano sampler; camera supervision is applied to pano centers relative to pano0.
data:
  dataset_root: /home/aoki/RethinkPanoVGGT_omega/dataset/converted_pano4vggt_omega_range_v2
  checkpoint: /home/aoki/RethinkPanoVGGT_omega/ckpt/vggt_omega_1b_512.pt
  pano_sample_mode: variable_neighborhood
  pano_min_count: 2
  # Verified on the local RTX 4090 with num_yaw=2: pano_max_count=8
  # completes one full train step, but high counts are slow.
  pano_max_count: 8
  pano_grouping: nearest

sampler:
  patch_size: 16
  window_size: 512
  # Keep this at 2 on a 24GB 4090 when pano_max_count can reach 8.
  # Raise on larger GPUs if denser per-pano coverage is needed.
  num_yaw: 2
  pitch_degrees: "0"
  fov_degrees: 75.0
  pano_height: 0
  pano_width: 0

supervision:
  gt_depth_semantics: range
  depth_max_m: 80.0
  pred_depth_scale: 21.137727657535685
  enable_camera_head: true
  camera_supervision_mode: pano_relative
  camera_loss_weight: 1.0
  camera_translation_weight: 1.0
  camera_rotation_weight: 0.0
  camera_fov_weight: 0.0
  pano_translation_consistency_weight: 0.1
  camera_position_mode: relative_anchor

optimization:
  trainable: luna_heads
  lr: 5.0e-5
  weight_decay: 0.05
  grad_clip: 1.0
  batch_size: 1

runtime:
  device: cuda
  distributed: auto
  dist_backend: nccl
  find_unused_parameters: true
  amp_dtype: bfloat16
  epochs: 100000
  max_steps: 1000000
  num_workers: 2
  seed: 42
  max_duration_minutes: 180.0
  save_every_steps: 0
  save_last: true
  checkpoint_format: trainable_delta

output:
  output_dir: /home/aoki/RethinkPanoVGGT_omega/outputs/multipano_pano_relative_4090
