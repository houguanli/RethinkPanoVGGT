# Memory probe: load an existing full-warmup checkpoint and enter LUNA directly.
# Every sample is fixed at 10 panoramas x 8 windows = 80 VGGT views.
data:
  dataset_root: ../../panovggt
  dataset_format: pano_minimal
  minimal_datasets: panocity
  dataset_sampling_weights: null
  dataset_split: train
  train_split_fraction: 0.95
  split_seed: 42
  metadata_path: null
  bad_sample_list: null
  curriculum_bins: null
  use_metadata_weights: false
  checkpoint: null
  pano_sample_mode: fixed_neighborhood
  pano_min_count: 10
  pano_max_count: 10
  pano_grouping: nearest
  randomize_pano_order: false
  output_depth_scale: 1000.0
  invalid_depth_value: 65535.0
  pano_position_step_m: 1.0

sampler:
  patch_size: 16
  window_size: 512
  num_yaw: 8
  pitch_degrees: "-15"
  fov_degrees: 120.0
  pano_height: 512
  pano_width: 1024
  luna_patch_layers: last3
  luna_camera_layers: "23"

model:
  enable_pano_global_token: true
  enable_pano_geometry_residual: false
  aggregator_use_checkpoint: true
  dense_head_frames_chunk_size: 1
  dense_head_use_checkpoint: true
  dense_head_return_confidence: false

supervision:
  gt_depth_semantics: range
  depth_max_m: 80.0
  depth_loss_mode: log_huber
  depth_log_error_clip: 0.5
  depth_log_huber_delta: 0.2
  depth_scale_alignment: none
  depth_scale_diagnostics_alignment: sample_l1_depth_weighted
  depth_scale_alignment_min: 0.05
  depth_scale_alignment_max: 1000000.0
  loss_sample_weighting: true
  min_window_valid_ratio: 0.05
  valid_ratio_loss_power: 0.5
  sample_weight_min: 0.25
  sample_weight_max: 1.25
  overlap_consistency_weight: 0.0
  global_point_loss_weight: 0.10
  global_point_stride: 16
  overlap_band_fraction: 0.20
  normalize_scene_scale: true
  pred_depth_scale: 1.0
  learn_pred_depth_scale: false
  pred_depth_scale_lr: null
  dataset_depth_scale_mode: none
  dataset_depth_scales: ""
  dataset_depth_scale_lr: null
  depth_residual_mode: none
  depth_residual_hidden: 32
  depth_residual_max_log: 0.5
  depth_residual_frames_chunk_size: 1
  depth_residual_use_checkpoint: false
  store_depth_residual_debug: false
  enable_camera_head: true
  camera_supervision_mode: pano_relative
  camera_loss_weight: 0.25
  camera_comparable_weight: 0.25
  camera_translation_weight: 1.0
  camera_rotation_weight: 0.25
  camera_fov_weight: 0.0
  pano_translation_consistency_weight: 0.0
  camera_translation_normalization: target_rms
  camera_translation_normalization_eps: 1.0
  camera_translation_min_baseline_m: 0.05
  camera_translation_loss_mode: vector_smooth_l1
  camera_center_residual_weight: 0.5
  camera_center_residual_max_ratio: 0.25
  camera_center_residual_max_abs: 0.02
  camera_depth_scale_alignment: false
  camera_position_mode: relative_anchor

optimization:
  trainable: luna_residual_tail_heads
  lr: 1.0e-5
  weight_decay: 0.05
  grad_clip: 1.0
  optimizer_type: adafactor
  batch_size: 1
  training_stages:
    - name: luna_memory_probe_10p_8w_fov120_512
      window_size: 512
      num_yaw: 8
      pitch_degrees: "-15"
      fov_degrees: 120.0
      dense_head_frames_chunk_size: 1
      pano_min_count: 10
      pano_max_count: 10
      trainable: luna_residual_tail_heads
      lr: 1.0e-5
      weight_decay: 0.05
      optimizer_type: adafactor
      camera_loss_weight: 0.25
      camera_center_residual_weight: 0.5
      global_point_loss_weight: 0.10
      enable_luna_forward: true
      enable_depth_residual: false
      train_depth_residual: false
      learn_pred_depth_scale: false
      learn_dataset_depth_scale: false

runtime:
  device: cuda
  distributed: auto
  dist_backend: nccl
  find_unused_parameters: true
  amp_dtype: bfloat16
  epochs: 100000
  max_steps: 1000000
  num_workers: 2
  seed: 47
  max_duration_minutes: 10.0
  save_every_steps: 25
  save_last: true
  checkpoint_format: trainable_delta
  debug_depth_dump: false
  debug_depth_threshold: 0.3
  debug_depth_max_dumps_per_step: 0
  debug_dir: logs/debug_luna_memory_probe_10p_8w_fov120_erp1024x512
  progress_bar: true
  progress_log_every: 1
  tensorboard: true
  tensorboard_dir: logs/luna_memory_probe_10p_8w_fov120_erp1024x512/tensorboard

output:
  output_dir: logs/luna_memory_probe_10p_8w_fov120_erp1024x512
