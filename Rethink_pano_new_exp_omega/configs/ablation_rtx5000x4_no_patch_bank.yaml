# Parameter-matched Patch Bank ablation. Patch/Camera GeoRA, the spherical
# position encoding, adapter hidden width, and residual scales remain enabled.
base_config: multipano_rtx5000x4_mixed4_pano_low_to_high_luna_after_full_warmup_9h.yaml

data:
  dataset_root: /mnt/e/PanoVGGT_minimal_datasets/datasets
  randomize_pano_order: false

sampler:
  luna_patch_bank_mode: none
  luna_patch_bank_shuffle_seed: 43

runtime:
  debug_dir: logs/ablation_rtx5000x4_no_patch_bank/debug
  tensorboard_dir: logs/ablation_rtx5000x4_no_patch_bank/tensorboard

output:
  output_dir: logs/ablation_rtx5000x4_no_patch_bank
