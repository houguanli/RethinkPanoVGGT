# Camera GeoRA ablation for the local RTX 4090 run initialized from the
# original 2026-07-16 warm-up checkpoint. Patch GeoRA and its ERP-aligned
# Patch Bank remain enabled; only Camera GeoRA is removed.
base_config: multipano_rtx5000x4_mixed4_pano_all384_luna_after_full_warmup_9h.yaml

data:
  dataset_root: /mnt/e/PanoVGGT_minimal_datasets/datasets
  randomize_pano_order: false

sampler:
  luna_patch_bank_mode: aligned
  luna_patch_bank_shuffle_seed: 43
  luna_camera_layers: none

runtime:
  debug_dir: logs/local0716_no_camera_geora_20260724_001/debug
  tensorboard_dir: logs/local0716_no_camera_geora_20260724_001/tensorboard

output:
  output_dir: logs/local0716_no_camera_geora_20260724_001
