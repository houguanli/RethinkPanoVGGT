# Single RTX 4090 debug profile for paired-pano training.
data:
  dataset_root: /home/aoki/RethinkPanoVGGT_omega/dataset/converted_pano4vggt_omega_range_v2
  checkpoint: /home/aoki/RethinkPanoVGGT_omega/ckpt/vggt_omega_1b_512.pt
  panos_per_sample: 2
  pano_grouping: nearest

sampler:
  patch_size: 16
  window_size: 512
  # Two panos x four yaw windows keeps the total VGGT view count at 8 on a 4090.
  # For larger GPUs, raise this back to 8 for denser full-pano coverage.
  num_yaw: 4
  pitch_degrees: "0"
  fov_degrees: 75.0
  pano_height: 0
  pano_width: 0

supervision:
  gt_depth_semantics: range
  depth_max_m: 80.0
  pred_depth_scale: 21.137727657535685
  enable_camera_head: true
  camera_loss_weight: 1.0
  camera_translation_weight: 1.0
  camera_rotation_weight: 1.0
  camera_fov_weight: 0.1
  camera_position_mode: relative_anchor

optimization:
  trainable: luna_heads
  lr: 5.0e-5
  weight_decay: 0.05
  grad_clip: 1.0
  batch_size: 1

runtime:
  device: cuda
  amp_dtype: bfloat16
  epochs: 100000
  max_steps: 1000000
  num_workers: 2
  seed: 42
  max_duration_minutes: 60.0
  save_every_steps: 0
  save_last: true
  checkpoint_format: trainable_delta

output:
  output_dir: /home/aoki/RethinkPanoVGGT_omega/Rethink_pano_new_exp_omega/outputs/luna_range_v2_multipano_pair_single4090_20260526
