# Single-pano PanoCity paired small-subset profile for one RTX 4090.
# Uses the local 5-pano subset under ../../panovggt/PanoCity_paired.
data:
  dataset_root: ../../panovggt/PanoCity_paired
  dataset_format: panocity_paired
  dataset_max_samples: 5
  checkpoint: ../ckpt/vggt_omega_1b_512.pt
  pano_sample_mode: single
  pano_min_count: 1
  pano_max_count: 1
  pano_grouping: nearest
  output_depth_scale: 1000.0
  invalid_depth_value: 65535.0
  pano_position_step_m: 1.0

sampler:
  patch_size: 16
  window_size: 512
  num_yaw: 8
  pitch_degrees: "0"
  fov_degrees: 75.0
  pano_height: 0
  pano_width: 0

supervision:
  gt_depth_semantics: range
  depth_max_m: 80.0
  pred_depth_scale: 5.491308212280273
  learn_pred_depth_scale: true
  pred_depth_scale_lr: 1.0e-4
  enable_camera_head: true
  camera_supervision_mode: none
  camera_loss_weight: 0.0
  camera_translation_weight: 0.0
  camera_rotation_weight: 0.0
  camera_fov_weight: 0.0
  pano_translation_consistency_weight: 0.1
  camera_position_mode: local_zero

optimization:
  trainable: luna_heads
  lr: 5.0e-5
  weight_decay: 0.05
  grad_clip: 1.0
  batch_size: 1

runtime:
  device: cuda
  distributed: none
  dist_backend: nccl
  find_unused_parameters: true
  amp_dtype: bfloat16
  epochs: 100000
  max_steps: 1000000
  num_workers: 2
  seed: 42
  max_duration_minutes: 480.0
  save_every_steps: 500
  save_last: true
  checkpoint_format: trainable_delta
  debug_depth_dump: true
  debug_depth_threshold: 0.3
  debug_depth_max_dumps_per_step: 2
  debug_dir: logs/debug_panocity_small_4090_8h

output:
  output_dir: logs/panocity_paired_small_4090_8h
