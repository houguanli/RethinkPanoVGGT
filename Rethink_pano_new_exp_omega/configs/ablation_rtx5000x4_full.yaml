# Full aligned reference. Every setting is inherited from the original
# 4x RTX5000 mixed4 low384 -> high512 LUNA schedule.
base_config: multipano_rtx5000x4_mixed4_pano_low_to_high_luna_after_full_warmup_9h.yaml

data:
  dataset_root: /mnt/e/PanoVGGT_minimal_datasets/datasets
  randomize_pano_order: false

sampler:
  luna_patch_bank_mode: aligned
  luna_patch_bank_shuffle_seed: 43

runtime:
  debug_dir: logs/ablation_rtx5000x4_full/debug
  tensorboard_dir: logs/ablation_rtx5000x4_full/tensorboard

output:
  output_dir: logs/ablation_rtx5000x4_full
