# Server defaults match multipano-work-pro@3ea1294, 4 x RTX 5000.
train_config: configs/train.yaml
dataset_root: /whitehole/AOKI/panovggt
base_checkpoint: /whitehole/AOKI/vggt-omega/ckpt/vggt_omega_1b_512.pt
nproc_per_node: 4
gpus: "0,1,2,3"
num_workers: 2
warmup_minutes: 120
completion_main_minutes: 480
completion_refine_minutes: 120
save_every_steps: 2000
auto_eval: true
eval:
  datasets: all
  limit_per_dataset: 0
  sample_policy: anchor
  pano_count_policy: panovggt
  camera_eval_max_panos: 3
  num_workers_per_gpu: 2
  seed: 123
  # 0 means checkpoint-native geometry: six yaw x two pitch rings, not yaw=4.
  window_size: 0
  num_yaw: 0
  resume: 1
