exp_name: mixed4_pano_officialscale_full_warmup_4090_3h_for_luna
img_size: 384
num_workers: 4
seed_value: 42
accum_steps: 1
patch_size: 16
val_epoch_freq: 999
max_img_per_gpu: 8

limit_train_batches: 1000000
limit_val_batches: 0
max_epochs: 100000
max_duration_minutes: 180.0
normalize_scene_scale: false
mode: train
device: cuda

data:
  train:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    shuffle: true
    pin_memory: false
    common_config:
      fix_img_num: 8
      fix_aspect_ratio: 1.0
      load_track: false
      track_num: 1024
      training: true
      inside_random: true
      img_size: ${img_size}
      patch_size: ${patch_size}
      rescale: false
      rescale_aug: false
      landscape_check: false
      debug: false
      get_nearby: false
      load_depth: true
      img_nums: [8, 8]
      max_img_per_gpu: ${max_img_per_gpu}
      allow_duplicate_img: false
      repeat_batch: false
      augs:
        cojitter: false
        cojitter_ratio: 0.0
        scales: null
        aspects: [1.0, 1.0]
        color_jitter: null
        gray_scale: false
        gau_blur: false
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.pano_minimal.PanoMinimalPinholeDataset
          split: train
          root: /mnt/e/PanoVGGT_minimal_datasets/datasets
          datasets: all
          len_train: 1000000
          output_depth_scale: 1000.0
          invalid_depth_value: 65535.0
          depth_max_m: 80.0
          train_split_fraction: 0.95
          split_seed: 42
          metadata_path: null
          bad_sample_list: null
          curriculum_bins: null
          use_metadata_weights: false
          num_yaw: 8
          pitch_degrees: -15.0
          fov_degrees: 75.0
  val: null

logging:
  log_dir: logs/${exp_name}
  log_visuals: false
  log_freq: 1
  progress_bar: true
  progress_log_every: 50
  log_level_primary: DEBUG
  log_level_secondary: WARNING
  all_ranks: false
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_reg_depth
        - loss_log_l1_depth
        - loss_overlap_depth
    val:
      keys_to_log:
        - loss_objective
        - loss_reg_depth
        - loss_log_l1_depth

checkpoint:
  save_dir: logs/${exp_name}/ckpts
  save_freq: 0
  resume_checkpoint_path: null
  strict: false

loss:
  _target_: loss.MultitaskLoss
  camera: null
  depth:
    weight: 1.0
    mode: log_huber
    pred_depth_scale: 2.7437050342559814
    log_error_clip: 0.5
    log_huber_delta: 0.2
    sample_weighting: true
    min_window_valid_ratio: 0.05
    valid_ratio_loss_power: 0.5
    sample_weight_min: 0.25
    sample_weight_max: 1.25
    overlap_consistency_weight: 0.02
    overlap_band_fraction: 0.20
    gradient_loss_fn: null
    valid_range: -1
  point: null
  track: null
  pano: null

optim:
  param_group_modifiers: false
  optimizer:
    _target_: torch.optim.Adafactor
    lr: 5e-5
    weight_decay: 0.05
    foreach: false
  frozen_module_names: []
  amp:
    enabled: true
    amp_dtype: bfloat16
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["aggregator"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["dense_head"]
        max_norm: 1.0
        norm_type: 2
  options: null

distributed:
  backend: nccl
  comms_dtype: null
  find_unused_parameters: true
  timeout_mins: 30
  gradient_as_bucket_view: true
  bucket_cap_mb: 25
  broadcast_buffers: true

cuda:
  cudnn_deterministic: false
  cudnn_benchmark: false
  allow_tf32: true

model:
  _target_: vggt_omega.models.vggt_omega.VGGTOmega
  patch_size: 16
  embed_dim: 1024
  enable_camera: false
  enable_depth: true
  enable_alignment: false
  checkpoint_path: ../ckpt/vggt_omega_1b_512.pt
  checkpoint_strict: false
  activation_checkpointing: true
