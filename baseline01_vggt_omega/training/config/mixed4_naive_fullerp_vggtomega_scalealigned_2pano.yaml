exp_name: naive_fullerp_vggtomega_scalealigned_2pano
experiment_variant: naive_vggt_omega
input_representation: full_erp_no_window_split
img_size: 384
num_workers: 2
seed_value: 42
accum_steps: 1
patch_size: 16
val_epoch_freq: 999
max_img_per_gpu: 2

limit_train_batches: 1000000
limit_val_batches: 0
max_epochs: 100000
max_duration_minutes: 180.0
max_duration_excludes_setup: true
normalize_scene_scale: true
save_checkpoint_on_exit: true
mode: train
device: cuda

data:
  train:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    shuffle: true
    pin_memory: false
    persistent_workers: false
    common_config:
      fix_img_num: 2
      fix_aspect_ratio: 0.5
      load_track: false
      track_num: 1024
      training: true
      inside_random: true
      img_size: ${img_size}
      patch_size: ${patch_size}
      rescale: false
      rescale_aug: false
      landscape_check: false
      debug: false
      get_nearby: false
      load_depth: true
      img_nums: [2, 2]
      max_img_per_gpu: ${max_img_per_gpu}
      allow_duplicate_img: false
      repeat_batch: false
      augs:
        cojitter: false
        cojitter_ratio: 0.0
        scales: null
        aspects: [0.5, 0.5]
        color_jitter: null
        gray_scale: false
        gau_blur: false
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.pano_minimal.PanoMinimalMultiPanoFullERPDataset
          split: train
          root: ${oc.env:PANOVGGT_ROOT,/mnt/e/PanoVGGT_minimal_datasets/datasets}
          datasets: all
          dataset_sampling_weights: "panocity:0.45,matterport3d:0.25,structured3d:0.25,stanford2d3ds:0.05"
          len_train: 1000000
          output_depth_scale: 1000.0
          invalid_depth_value: 65535.0
          depth_max_m: 80.0
          train_split_fraction: 0.95
          split_seed: 42
          bad_sample_list: ../Rethink_pano_new_exp_omega/configs/structured3d_bad_scenes.txt
          # Short-run cap is applied independently to each dataset below.
          max_samples: 500
          pano_sample_mode: fixed_neighborhood
          pano_min_count: 2
          pano_max_count: 2
          dataset_pano_counts: "panocity:2,matterport3d:2,stanford2d3ds:2,structured3d:2"
          grouping: nearest
          camera_supervised_datasets: "panocity,stanford2d3ds"
  val: null

logging:
  log_dir: logs/${exp_name}
  log_visuals: false
  log_freq: 1
  progress_bar: true
  progress_log_every: 20
  log_level_primary: DEBUG
  log_level_secondary: WARNING
  all_ranks: false
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_FL
        - camera_valid_fraction
        - loss_conf_depth
        - loss_reg_depth
        - loss_grad_depth
    val:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_FL
        - loss_conf_depth
        - loss_reg_depth
        - loss_grad_depth

checkpoint:
  save_dir: logs/${exp_name}/ckpts
  save_freq: 0
  save_step_freq: 0
  resume_checkpoint_path: null
  resume_optimizer: true
  resume_training_progress: true
  resume_scaler: true
  strict: false

loss:
  _target_: loss.MultitaskLoss
  camera:
    weight: 5.0
    loss_type: l1
    weight_trans: 1.0
    weight_rot: 1.0
    weight_focal: 0.5
  depth:
    weight: 1.0
    gradient_loss_fn: grad
    valid_range: 0.98
    mode: vggt
    pred_depth_scale: 1.0
    depth_scale_alignment: sample_log_median
    depth_scale_alignment_min: 0.05
    depth_scale_alignment_max: 1000000.0
  point: null
  track: null
  pano: null

lora:
  enabled: false

optim:
  param_group_modifiers: false
  optimizer:
    _target_: torch.optim.Adafactor
    lr: 5e-5
    weight_decay: 0.05
    foreach: false
  frozen_module_names: []
  amp:
    enabled: true
    amp_dtype: bfloat16
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["aggregator"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["dense_head"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["camera_head"]
        max_norm: 1.0
        norm_type: 2
  options: null

distributed:
  backend: nccl
  comms_dtype: null
  find_unused_parameters: true
  timeout_mins: 30
  gradient_as_bucket_view: true
  bucket_cap_mb: 25
  broadcast_buffers: true

cuda:
  cudnn_deterministic: false
  cudnn_benchmark: false
  allow_tf32: true

model:
  _target_: vggt_omega.models.vggt_omega.VGGTOmega
  patch_size: 16
  embed_dim: 1024
  enable_camera: true
  enable_depth: true
  enable_alignment: false
  checkpoint_path: ${oc.env:VGGT_OMEGA_CKPT,/home/aoki/RethinkPanoVGGT_omega/ckpt/vggt_omega_1b_512.pt}
  checkpoint_strict: false
  activation_checkpointing: true
