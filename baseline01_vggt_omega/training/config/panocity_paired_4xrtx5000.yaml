exp_name: panocity_paired_baseline01_full_finetune
img_size: 512
num_workers: 4
seed_value: 42
accum_steps: 1
patch_size: 16
val_epoch_freq: 99
max_img_per_gpu: 8

limit_train_batches: 1000
limit_val_batches: 0
max_epochs: 1
mode: train
device: cuda

data:
  train:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    shuffle: True
    pin_memory: False
    common_config:
      fix_img_num: 8
      fix_aspect_ratio: 1.0
      load_track: False
      track_num: 1024
      training: True
      inside_random: True
      img_size: ${img_size}
      patch_size: ${patch_size}
      rescale: False
      rescale_aug: False
      landscape_check: False
      debug: False
      get_nearby: False
      load_depth: True
      img_nums: [8, 8]
      max_img_per_gpu: ${max_img_per_gpu}
      allow_duplicate_img: False
      repeat_batch: False
      augs:
        cojitter: False
        cojitter_ratio: 0.0
        scales: null
        aspects: [1.0, 1.0]
        color_jitter: null
        gray_scale: False
        gau_blur: False
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.panocity_paired.PanoCityPairedPinholeDataset
          split: train
          root: ../../panovggt/PanoCity_paired
          len_train: 100000
          output_depth_scale: 1000.0
          invalid_depth_value: 65535.0
          depth_max_m: 80.0
          num_yaw: 8
          pitch_degrees: 0.0
          fov_degrees: 75.0
  val: null

logging:
  log_dir: logs/${exp_name}
  log_visuals: False
  log_freq: 1
  log_level_primary: DEBUG
  log_level_secondary: WARNING
  all_ranks: False
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_conf_depth
        - loss_reg_depth
        - loss_grad_depth
        - loss_log_l1_depth
    val:
      keys_to_log:
        - loss_objective
        - loss_conf_depth
        - loss_reg_depth
        - loss_grad_depth
        - loss_log_l1_depth

checkpoint:
  save_dir: logs/${exp_name}/ckpts
  save_freq: 1
  resume_checkpoint_path: null
  strict: False

loss:
  _target_: loss.MultitaskLoss
  camera: null
  depth:
    weight: 1.0
    mode: log_l1
    pred_depth_scale: 5.491308212280273
    gradient_loss_fn: null
    valid_range: -1
  point: null
  track: null
  pano: null

optim:
  param_group_modifiers: False
  optimizer:
    _target_: torch.optim.AdamW
    lr: 5e-5
    weight_decay: 0.05
  frozen_module_names: []
  amp:
    enabled: True
    amp_dtype: bfloat16
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["aggregator"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["depth"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["camera"]
        max_norm: 1.0
        norm_type: 2
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: 5e-5
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 5e-5
              end_value: 1e-8
          lengths: [0.05, 0.95]
          interval_scaling: ["rescaled", "rescaled"]
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.05

model:
  _target_: vggt_omega.models.vggt_omega.VGGTOmega
  patch_size: 16
  embed_dim: 1024
  enable_camera: True
  enable_depth: True
  enable_alignment: False
  checkpoint_path: ../../ckpt/vggt_omega_1b_512.pt
  checkpoint_strict: False

distributed:
  backend: nccl
  comms_dtype: null
  find_unused_parameters: False
  timeout_mins: 30
  gradient_as_bucket_view: True
  bucket_cap_mb: 25
  broadcast_buffers: True

cuda:
  cudnn_deterministic: False
  cudnn_benchmark: False
  allow_tf32: True
